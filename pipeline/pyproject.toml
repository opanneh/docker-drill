[project]
name = "pipeline"
version = "0.1.0"
description = "Python data pipeline"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.0",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.6",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.7.1",
]
